services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rth_modern
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "!ChangeMe!"
    ports:
      - "54321:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./rth_modern_postgres.sql:/docker-entrypoint-initdb.d/init.sql

  php:
    build: .
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/var
    environment:
      DATABASE_URL: "postgresql://app:!ChangeMe!@database:5432/rth_modern?serverVersion=16&charset=utf8"
    depends_on:
      - database

  nginx:
    image: nginx:alpine
    ports:
      - "8889:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

volumes:
  pg-data:
