# Force trigger CI/CD pipeline
name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan (Stage 2)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup .NET SDK (Manual Install)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -O
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV
          echo "$HOME/.dotnet" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore

      - name: NuGet Dependency Vulnerability Audit (Stage 2)
        run: |
          output=$(dotnet list LoreTest.slnx package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -E "Critical|High"; then
            echo "High or Critical vulnerable NuGet packages detected!"
            exit 1
          fi

      - name: Build (with Roslyn SAST Security Analyzers)
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test LoreTest.Tests/LoreTest.Tests.csproj --no-build --verbosity normal

  build-and-push:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trivy Config & Dockerfile Scan (Stage 3)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trivy Container Image Vulnerability Scan (Stage 3)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  deploy-test:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Test Environment
        run: |
          echo "Deploying to test environment (Localhost)..."
          docker compose -f docker-compose.test.yml pull
          docker compose -f docker-compose.test.yml up -d

  deploy-preprod:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to PreProd Environment
        run: |
          echo "Deploying to preprod environment (Localhost)..."
          docker compose -f docker-compose.preprod.yml pull
          docker compose -f docker-compose.preprod.yml up -d

  playwright-tests:
    needs: [deploy-preprod, deploy-test]
    if: always() && (needs.deploy-preprod.result == 'success' || needs.deploy-test.result == 'success')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Build Playwright Tests (including SecurityTests)
        run: dotnet build LoreTest.Playwright/LoreTest.Playwright.csproj
      - name: Build Reqnroll BDD Specs
        run: dotnet build LoreTest.Specs/LoreTest.Specs.csproj
      - name: Run Playwright E2E & Security Tests (Stage 1)
        env:
          BASE_URL: ${{ github.ref == 'refs/heads/main' && (secrets.PREPROD_URL || 'http://localhost:5002') || (secrets.TEST_URL || 'http://localhost:5001') }}
          PLAYWRIGHT_BROWSERS_PATH: C:\actions-runner\_work\ms-playwright
        run: dotnet test LoreTest.Playwright/LoreTest.Playwright.csproj --no-build --verbosity normal --logger trx --results-directory allure-results-combined
      - name: Run Reqnroll BDD Specs
        if: always()
        env:
          BASE_URL: ${{ github.ref == 'refs/heads/main' && (secrets.PREPROD_URL || 'http://localhost:5002') || (secrets.TEST_URL || 'http://localhost:5001') }}
          PLAYWRIGHT_BROWSERS_PATH: C:\actions-runner\_work\ms-playwright
        run: dotnet test LoreTest.Specs/LoreTest.Specs.csproj --no-build --verbosity normal --logger trx --results-directory allure-results-combined
      - name: Run OWASP ZAP Baseline DAST Scan (Stage 4)
        if: always()
        env:
          ZAP_TARGET_URL: ${{ github.ref == 'refs/heads/main' && 'http://host.docker.internal:5002' || 'http://host.docker.internal:5001' }}
        run: |
          New-Item -ItemType Directory -Force -Path allure-results-combined | Out-Null
          Copy-Item -Path ".zap\rules.tsv" -Destination "allure-results-combined\rules.tsv" -Force
          $workDir = (Resolve-Path "allure-results-combined").Path
          docker run --rm --add-host=host.docker.internal:host-gateway -v "${workDir}:/zap/wrk:rw" -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t $env:ZAP_TARGET_URL -c rules.tsv -J zap-report.json -r zap-report.html -I
      - name: Upload Allure Results Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results
          path: allure-results-combined/
          retention-days: 1

  publish-report:
    needs: playwright-tests
    if: always() && (needs.playwright-tests.result == 'success' || needs.playwright-tests.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download Allure Results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results
      - name: Convert TRX & ZAP Results to Native Allure JSON Results
        run: |
          python convert-trx.py
      - name: Load Allure Report History
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Build Allure Report
        uses: simple-elf/allure-report-action@master
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
